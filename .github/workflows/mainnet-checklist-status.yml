name: Mainnet Checklist Status

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  parser-tests:
    name: Test checklist parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fixture-based parser tests
        run: node --test scripts/mainnet-checklist-status.test.cjs

  update-checklist:
    name: Update checklist statuses
    needs: parser-tests
    runs-on: namespace-profile-nursca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark rows linked to closed issues as done
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {
              issueNumbersForRepository,
              updateClosedIssueRows,
              auditChecklist,
            } = require('./scripts/mainnet-checklist-status.cjs');

            const checklistPath = 'docs/mainnet-launch-checklist.md';
            const content = fs.readFileSync(checklistPath, 'utf8');
            const issueNumbers = issueNumbersForRepository(
              content,
              context.repo.owner,
              context.repo.repo,
            );
            const issueStates = new Map();

            for (const issue_number of issueNumbers) {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });
              issueStates.set(issue_number, data.state);
            }

            const audit = auditChecklist(
              content,
              context.repo.owner,
              context.repo.repo,
              issueStates,
            );
            const stale = audit.filter((item) => !item.accurate);
            core.info(`Checked ${audit.length} linked checklist rows; ${stale.length} need updates.`);
            core.setOutput('checked_rows', audit.length);
            core.setOutput('stale_rows', stale.length);

            const closedIssues = [...issueStates.entries()]
              .filter(([, state]) => state === 'closed')
              .map(([issueNumber]) => issueNumber);
            const updated = updateClosedIssueRows(
              content,
              context.repo.owner,
              context.repo.repo,
              closedIssues,
            );

            if (updated !== content) {
              fs.writeFileSync(checklistPath, updated);
            }

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: docs: update mainnet checklist statuses
          title: docs: update mainnet checklist statuses
          body: |
            Automated update from the Mainnet Checklist Status workflow.

            Rows linked to closed issues were marked as `Done` after the tested parser audited the current checklist.
          branch: automation/mainnet-checklist-status
          delete-branch: true
