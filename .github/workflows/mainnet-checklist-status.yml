name: Mainnet Checklist Status

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  update-checklist:
    name: Update checklist statuses
    runs-on: namespace-profile-nursca

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test checklist parser
        run: node --test scripts/mainnet-checklist-status.test.js

      - name: Mark rows linked to closed issues as done
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { parseChecklist, updateChecklist, summarizeChecklist } = require('./scripts/mainnet-checklist-status');
            const path = 'docs/mainnet-launch-checklist.md';
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const content = fs.readFileSync(path, 'utf8');
            const rows = parseChecklist(content, repository);
            const issueNumbers = [...new Set(rows.map((row) => row.issueNumber).filter(Number.isInteger))];
            const closedIssues = new Set();

            for (const issue_number of issueNumbers) {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });

              if (data.state === 'closed') closedIssues.add(issue_number);
            }

            const result = updateChecklist(content, repository, closedIssues);
            const summary = summarizeChecklist(result.content, repository);
            core.info(`Checklist status: ${JSON.stringify(summary)}`);
            core.setOutput('checklist-summary', JSON.stringify(summary));

            if (result.changed) fs.writeFileSync(path, result.content);

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: docs: update mainnet checklist statuses
          title: docs: update mainnet checklist statuses
          body: |
            Automated update from the Mainnet Checklist Status workflow.

            Rows linked to closed issues were marked as `Done`. The parser fixture tests ran before the update.
          branch: automation/mainnet-checklist-status
          delete-branch: true
